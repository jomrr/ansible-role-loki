---
# role: loki
# file: tasks/main.yml

- name: LOKI | Create the service group
  become: true
  become_user: root
  ansible.builtin.group:
    name: loki
    system: true

- name: LOKI | Create the service account
  become: true
  become_user: root
  ansible.builtin.user:
    name: loki
    group: loki
    system: true
    home: /var/lib/loki
    create_home: false
    shell: /bin/false

- name: LOKI | Create the systemd drop-in directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/systemd/system/loki.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: LOKI | Select the managed configuration before the package starts the service
  become: true
  become_user: root
  ansible.builtin.template:
    src: service.conf.j2
    dest: /etc/systemd/system/loki.service.d/10-ansible.conf
    owner: root
    group: root
    mode: '0644'
  notify: LOKI | Restart Loki

- name: LOKI | Trust the Grafana RPM signing key
  become: true
  become_user: root
  ansible.builtin.rpm_key:
    key: https://rpm.grafana.com/gpg.key
    fingerprint: B53AE77BADB630A683046005963FA27710458545
    state: present
  when: ansible_facts.os_family in ['RedHat', 'Suse']

- name: LOKI | Install the official Grafana package for this platform
  ansible.builtin.include_tasks: "install-{{ ansible_facts.os_family }}.yml"

- name: LOKI | Validate and install the configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: loki.yaml.j2
    dest: /etc/loki/loki.yaml
    owner: root
    group: loki
    mode: '0640'
    backup: true
    validate: /usr/bin/loki -config.file=%s -verify-config
  no_log: true
  diff: false
  notify: LOKI | Restart Loki

- name: LOKI | Apply pending service changes
  ansible.builtin.meta: flush_handlers

- name: LOKI | Enable and start the service
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: loki.service
    enabled: true
    state: started
