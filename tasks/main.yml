---
# role: loki
# file: tasks/main.yml

- name: LOKI | Install Grafana Loki
  ansible.builtin.import_tasks: install.yml

- name: LOKI | Create the systemd drop-in directory
  become: true
  become_user: root
  ansible.builtin.file:
    path: /etc/systemd/system/loki.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: LOKI | Install the systemd sandbox and select the managed configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: service.conf.j2
    dest: /etc/systemd/system/loki.service.d/10-ansible.conf
    owner: root
    group: root
    mode: '0644'
  notify: LOKI | Restart Loki

- name: LOKI | Validate and install the configuration
  become: true
  become_user: root
  ansible.builtin.template:
    src: loki.yaml.j2
    dest: /etc/loki/loki.yaml
    owner: root
    group: loki
    mode: '0640'
    backup: true
    validate: /usr/bin/loki -config.file=%s -verify-config
  no_log: true
  diff: false
  notify: LOKI | Restart Loki

- name: LOKI | Apply pending service changes
  ansible.builtin.meta: flush_handlers

- name: LOKI | Enable and start the service
  become: true
  become_user: root
  ansible.builtin.systemd_service:
    name: loki.service
    enabled: true
    state: started
