---
# role: loki
# file: tasks/install-RedHat.yml

- name: LOKI | Configure the signed Grafana DNF repository
  become: true
  become_user: root
  ansible.builtin.yum_repository:
    name: grafana
    description: Grafana Labs
    baseurl: https://rpm.grafana.com
    gpgkey: https://rpm.grafana.com/gpg.key
    gpgcheck: true
    repo_gpgcheck: true
    enabled: true
    mode: '0644'

- name: LOKI | Check whether DNF can read the configured repository
  ansible.builtin.stat:
    path: /etc/yum.repos.d/grafana.repo
  register: __loki_dnf_source

- name: LOKI | Install Loki from the Grafana DNF repository
  become: true
  become_user: root
  ansible.builtin.dnf:
    name: loki
    state: present
    disablerepo: '*'
    enablerepo: grafana
  environment: "{{ __loki_package_environment }}"
  when: __loki_dnf_source.stat.exists
