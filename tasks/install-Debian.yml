---
# role: loki
# file: tasks/install-Debian.yml

- name: LOKI | Install the signing key for the Grafana APT repository
  become: true
  become_user: root
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    owner: root
    group: root
    mode: '0644'

- name: LOKI | Configure the signed Grafana APT repository
  become: true
  become_user: root
  ansible.builtin.copy:
    src: grafana.sources
    dest: /etc/apt/sources.list.d/grafana.sources
    owner: root
    group: root
    mode: '0644'
  register: __loki_apt_repository

- name: LOKI | Prefer the Grafana build of the Loki package
  become: true
  become_user: root
  ansible.builtin.template:
    src: apt-preferences.j2
    dest: /etc/apt/preferences.d/grafana-loki
    owner: root
    group: root
    mode: '0644'

- name: LOKI | Check whether APT can read the configured repository
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/grafana.sources
  register: __loki_apt_source

- name: LOKI | Install Loki from APT
  become: true
  become_user: root
  ansible.builtin.apt:
    name: loki
    state: present
    update_cache: "{{ __loki_apt_repository.changed }}"
  environment: "{{ __loki_package_environment }}"
  when: __loki_apt_source.stat.exists
