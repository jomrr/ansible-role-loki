---
# role: loki
# file: tasks/install.yml

- name: LOKI | Create the service group
  become: true
  become_user: root
  ansible.builtin.group:
    name: loki
    system: true

- name: LOKI | Create the service account
  become: true
  become_user: root
  ansible.builtin.user:
    name: loki
    group: loki
    system: true
    home: /var/lib/loki
    create_home: false
    shell: /bin/false

- name: LOKI | Trust the Grafana RPM signing key
  become: true
  become_user: root
  ansible.builtin.rpm_key:
    key: https://rpm.grafana.com/gpg.key
    fingerprint: B53AE77BADB630A683046005963FA27710458545
    state: present
  when: ansible_facts.os_family in ['RedHat', 'Suse']

- name: LOKI | Install the official Grafana package for this platform
  ansible.builtin.include_tasks: "install-{{ ansible_facts.os_family }}.yml"
